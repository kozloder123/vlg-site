<!DOCTYPE html>
<html lang="ru" class="scroll-smooth">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VLG — FTAP Script</title>
<link rel="icon" type="image/png" href="https://i.pinimg.com/736x/7d/a0/01/7da00129b8c8e62ecefd6c5cbaa80a9e.jpg" />
<link rel="apple-touch-icon" href="https://i.pinimg.com/736x/7d/a0/01/7da00129b8c8e62ecefd6c5cbaa80a9e.jpg" />
<meta name="description" content="Strong FTAP script with rich functionality. Official website and community." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Orbitron:wght@600;700;800;900&family=Rajdhani:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --pink-100:#ffe4ef;--pink-200:#ffc7de;--pink-300:#ff9fc4;
    --pink-400:#ff6fa8;--pink-500:#ff3f8e;--pink-600:#e60077;
    --pink-700:#b80060;--pink-800:#8a0049;--pink-900:#5c0030;
    --pink-950:#2b0018;
    --bg:#0a0507;--bg2:#120810;
    --text:#f5e6ee;--muted:#a888a0;
  }
  html{scroll-behavior:smooth}
  body{
    background:radial-gradient(circle at 50% 0%, #1a0711 0%, #0a0508 40%, #050304 100%);
    color:var(--text);
    font-family:'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    overflow-x:hidden;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .ambient-grid{
    position:fixed;inset:0;pointer-events:none;z-index:1;
    background-image:
      linear-gradient(90deg, rgba(255,105,180,0.03) 1px, transparent 1px),
      linear-gradient(rgba(255,105,180,0.03) 1px, transparent 1px);
    background-size:44px 44px;
  }
  .ambient-glow-red{
    position:fixed;top:0;left:50%;transform:translateX(-50%);
    width:100%;max-width:900px;height:450px;
    pointer-events:none;z-index:-1;
    background:radial-gradient(70% 50% at 50% 25%, rgba(255,63,142,0.18), rgba(230,0,119,0.06) 45%, transparent 75%);
  }
  .ambient-glow-bottom{
    position:fixed;bottom:0;left:50%;transform:translateX(-50%);
    width:100%;max-width:900px;height:450px;
    pointer-events:none;z-index:-1;
    background:radial-gradient(75% 55% at 50% 85%, rgba(200,15,100,0.16), rgba(140,10,70,0.04) 50%, transparent 80%);
  }

  /* ==== CHECK SCREEN ==== */
  #checkScreen{
    position:fixed;inset:0;z-index:1000;
    display:flex;align-items:center;justify-content:center;
    background:#070305;padding:16px;
    transition:opacity 0.6s ease;
    font-family:'Plus Jakarta Sans', sans-serif;
  }
  #checkScreen.fade-out{opacity:0;pointer-events:none}
  .check-glow{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    width:600px;height:450px;pointer-events:none;z-index:-1;
    background:radial-gradient(ellipse 65% 55% at 50% 50%, rgba(255,63,142,0.18) 0%, rgba(230,0,119,0.05) 50%, transparent 80%);
  }
  .check-card{
    width:100%;max-width:430px;
    background:rgba(20,9,15,0.95);
    border:1px solid rgba(255,105,180,0.35);
    border-radius:26px;padding:32px;
    box-shadow:0 20px 50px rgba(0,0,0,0.9), 0 0 35px rgba(255,63,142,0.18);
    backdrop-filter:blur(20px);
    position:relative;
  }
  .check-card::before{
    content:'';position:absolute;top:0;left:32px;right:32px;height:1.5px;
    background:linear-gradient(90deg,transparent,rgba(255,105,180,0.7),transparent);
  }
  .check-header{text-align:center;margin-bottom:28px}
  .check-logo{
    display:inline-flex;align-items:center;justify-content:center;
    width:64px;height:64px;border-radius:18px;
    background:linear-gradient(135deg,#e60077,#5c0030);
    padding:2px;margin-bottom:16px;position:relative;
    box-shadow:0 0 25px rgba(255,63,142,0.4);
  }
  .check-logo img{width:100%;height:100%;object-fit:cover;border-radius:15px;background:#0b0c10}
  .check-logo-badge{
    position:absolute;bottom:-4px;right:-4px;width:24px;height:24px;
    border-radius:50%;background:#2b0018;border:1px solid #ff6fa8;
    display:flex;align-items:center;justify-content:center;
    color:#ff6fa8;font-size:12px;
  }
  .check-title{
    font-family:'Cinzel',serif;
    font-weight:900;font-size:26px;letter-spacing:2px;
    background:linear-gradient(180deg,#ff9fc4,#ff3f8e 60%,#b80060);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
    text-shadow:0 0 20px rgba(255,63,142,0.5);
    margin-bottom:6px;
  }
  .check-sub{color:#a888a0;font-size:13px}

  .check-box{
    display:flex;align-items:center;justify-content:space-between;
    padding:18px 20px;border-radius:16px;
    background:#14101a;border:1px solid rgba(255,105,180,0.3);
    cursor:pointer;transition:all 0.3s;
  }
  .check-box:hover{border-color:rgba(255,63,142,0.6);background:#181420}
  .check-box.loading{background:rgba(255,63,142,0.08);border-color:rgba(255,63,142,0.6)}
  .check-box.done{background:rgba(16,185,129,0.1);border-color:rgba(16,185,129,0.5)}
  .check-left{display:flex;align-items:center;gap:16px}
  .check-circle{
    width:28px;height:28px;border-radius:8px;
    border:2px solid #5c3040;background:#1a0e16;
    display:flex;align-items:center;justify-content:center;
    transition:all 0.3s;
  }
  .check-box.loading .check-circle{border-color:transparent}
  .check-box.done .check-circle{background:#10b981;border-color:#10b981;box-shadow:0 0 12px #10b981}
  .check-circle .spinner{
    width:14px;height:14px;border-radius:50%;
    border:2px solid rgba(255,63,142,0.3);
    border-top-color:#ff6fa8;
    animation:spin 0.7s linear infinite;
    display:none;
  }
  .check-box.loading .spinner{display:block}
  .check-box.done .spinner{display:none}
  .check-check{display:none;color:#fff}
  .check-box.done .check-check{display:block}
  @keyframes spin{to{transform:rotate(360deg)}}
  .check-text{font-size:15px;font-weight:600;color:#f5e6ee}
  .check-guard{
    display:flex;flex-direction:column;align-items:center;gap:2px;
    padding-left:14px;border-left:1px solid rgba(255,105,180,0.15);
    font-family:'Cinzel',serif;font-size:9px;color:#a888a0;letter-spacing:1.5px;
  }
  .check-guard .shield{color:#ff6fa8;font-size:18px;line-height:1}

  .check-progress{overflow:hidden;max-height:0;transition:max-height 0.3s ease}
  .check-progress.show{max-height:100px;margin-top:16px}
  .check-progress-bar{
    height:6px;background:#1a0e16;border-radius:4px;overflow:hidden;
    border:1px solid rgba(255,63,142,0.2);
  }
  .check-progress-fill{
    height:100%;width:0%;
    background:linear-gradient(90deg,#e60077,#ff9fc4);
    box-shadow:0 0 10px #ff3f8e;
    transition:width 0.2s ease;
  }
  .check-progress-label{
    display:flex;justify-content:space-between;
    margin-top:6px;font-size:11px;font-family:'Courier New',monospace;color:#a888a0;
  }
  .check-progress-label .pct{color:#ff6fa8;font-weight:700}

  .check-footer{
    display:flex;justify-content:space-between;align-items:center;
    margin-top:22px;padding-top:14px;border-top:1px solid rgba(255,105,180,0.15);
    font-size:10.5px;font-family:'Courier New',monospace;color:#a888a0;
  }
  .check-footer .ray{display:flex;align-items:center;gap:6px}
  .check-footer .dot{
    width:6px;height:6px;border-radius:50%;background:#ff3f8e;
    animation:pulse 2s ease-in-out infinite;
  }
  @keyframes pulse{50%{opacity:0.4}}

  /* ==== NAVBAR ==== */
  .navbar{
    position:fixed;top:0;left:0;right:0;z-index:100;
    padding:18px 0;
    transition:all 0.3s;
    background:transparent;
  }
  .navbar.scrolled{
    background:rgba(10,5,7,0.9);
    backdrop-filter:blur(12px);
    border-bottom:1px solid rgba(255,63,142,0.15);
    padding:12px 0;
    box-shadow:0 10px 30px rgba(0,0,0,0.8);
  }
  .navbar-inner{
    max-width:1280px;margin:0 auto;padding:0 24px;
    display:flex;align-items:center;justify-content:space-between;
  }
  .nav-brand{display:flex;align-items:center;gap:12px;cursor:pointer;user-select:none}
  .nav-logo{
    width:44px;height:44px;border-radius:50%;
    background:linear-gradient(135deg,#ff3f8e,#5c0030);
    padding:2px;
    box-shadow:0 0 18px rgba(255,63,142,0.5);
    overflow:hidden;flex-shrink:0;
    transition:all 0.3s;
  }
  .nav-logo:hover{box-shadow:0 0 26px rgba(255,63,142,0.85)}
  .nav-logo img{width:100%;height:100%;object-fit:cover;border-radius:50%}
  .nav-name{
    font-family:'Cinzel',serif;font-weight:900;font-size:18px;
    letter-spacing:2px;color:#f5e6ee;min-width:70px;
    text-shadow:0 0 12px rgba(255,63,142,0.5);
  }
  .nav-cursor{
    display:inline-block;width:2px;height:16px;
    background:rgba(255,159,196,0.9);margin-left:2px;
    animation:pulse 1s ease-in-out infinite;
    vertical-align:middle;
  }
  .nav-links{display:flex;gap:14px;align-items:center}
  .snake-btn{
    background:rgba(255,255,255,0.03);
    border-radius:9999px;padding:2px;
    position:relative;overflow:hidden;display:inline-flex;
    transition:all 0.25s;
  }
  .snake-btn::before{
    content:'';position:absolute;inset:-120%;
    background:conic-gradient(transparent 0deg 160deg, rgba(255,0,120,0.05) 220deg, rgba(255,63,142,0.4) 280deg, rgba(255,63,142,0.85) 330deg, #ff3f8e 355deg, #fff 360deg);
    animation:snakeRotate 3.2s linear infinite;
  }
  @keyframes snakeRotate{to{transform:rotate(360deg)}}
  .snake-btn:hover{box-shadow:0 0 18px rgba(255,63,142,0.4)}
  .snake-inner{
    position:relative;z-index:1;
    background:#0d0a12;border-radius:9999px;
    padding:8px 20px;
    font-weight:600;font-size:13.5px;color:#f5e6ee;
    transition:background 0.2s;cursor:pointer;
  }
  .snake-inner:hover{background:#1a1220}
  .nav-right{display:flex;gap:12px;align-items:center}
  .lang-btn{
    display:flex;align-items:center;gap:6px;
    padding:7px 14px;border-radius:9999px;
    background:rgba(20,15,26,0.8);border:1px solid rgba(120,100,140,0.4);
    color:#d0b8c8;font-size:12px;font-weight:600;cursor:pointer;
    transition:all 0.2s;
  }
  .lang-btn:hover{border-color:rgba(255,63,142,0.5);color:#fff}
  .cta-btn{
    padding:9px 22px;border-radius:9999px;
    background:linear-gradient(115deg,#b80060,#e60077 28%,#ff6fa8,#e60077 68%,#8a0049);
    background-size:260% 100%;
    color:#fff;font-weight:700;font-size:13.5px;
    cursor:pointer;border:none;
    box-shadow:0 0 20px rgba(255,63,142,0.5);
    animation:crimsonFlow 3.5s ease-in-out infinite;
    transition:all 0.2s;
  }
  .cta-btn:hover{box-shadow:0 0 32px rgba(255,63,142,0.8)}
  @keyframes crimsonFlow{
    0%{background-position:100% 0}
    50%{background-position:0 0}
    100%{background-position:-100% 0}
  }
  .nav-mobile-menu{
    display:none;flex-direction:column;
    background:rgba(12,10,16,0.97);
    backdrop-filter:blur(20px);
    border-bottom:1px solid rgba(255,63,142,0.3);
    padding:20px 24px;gap:14px;
    max-height:0;overflow:hidden;
    transition:max-height 0.3s;
  }
  .nav-mobile-menu.open{max-height:400px}
  .nav-mobile-menu a{
    display:flex;align-items:center;gap:10px;
    color:#d0b8c8;text-decoration:none;
    font-weight:600;font-size:15px;
    padding:10px 0;
    border-bottom:1px solid rgba(255,63,142,0.08);
  }
  .nav-mobile-menu a:hover{color:#ff9fc4}
  .menu-toggle{
    display:none;padding:8px;
    background:rgba(20,15,26,0.8);border:1px solid rgba(255,63,142,0.3);
    border-radius:12px;color:#d0b8c8;cursor:pointer;
    font-size:20px;line-height:1;
  }

  /* ==== HERO ==== */
  .hero{
    position:relative;min-height:100vh;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    padding:120px 20px 80px;
    text-align:center;
    overflow:hidden;
  }
  .hero-bg{
    position:absolute;inset:0;z-index:-2;overflow:hidden;
    mask-image:linear-gradient(to bottom, rgba(0,0,0,1) 0%, rgba(0,0,0,1) 40%, rgba(0,0,0,0.85) 60%, rgba(0,0,0,0.4) 78%, rgba(0,0,0,0.1) 90%, rgba(0,0,0,0) 100%);
    -webkit-mask-image:linear-gradient(to bottom, rgba(0,0,0,1) 0%, rgba(0,0,0,1) 40%, rgba(0,0,0,0.85) 60%, rgba(0,0,0,0.4) 78%, rgba(0,0,0,0.1) 90%, rgba(0,0,0,0) 100%);
  }
  .hero-bg img{
    width:100%;height:100%;object-fit:cover;object-position:center 35%;
    filter:brightness(0.65) contrast(1.05) saturate(1.1);
    opacity:1;
  }
  .hero-bg::after{
    content:'';position:absolute;inset:0;
    background:
      radial-gradient(ellipse 75% 65% at 50% 45%, rgba(255,63,142,0.14) 0%, transparent 75%),
      linear-gradient(180deg, rgba(10,5,7,0.5) 0%, rgba(10,5,7,0.85) 70%, rgba(10,5,7,1) 100%);
  }
  .hero-content{position:relative;z-index:2;max-width:900px;display:flex;flex-direction:column;align-items:center;gap:24px}
  .hero-title{
    font-family:'Cinzel',serif;font-weight:900;
    font-size:clamp(72px, 14vw, 180px);
    letter-spacing:6px;line-height:0.9;
    background:linear-gradient(180deg,#ffc7de 0%,#ff6fa8 40%,#e60077 70%,#8a0049 100%);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
    animation:neonPinkPulse 2.6s ease-in-out infinite;
  }
  @keyframes neonPinkPulse{
    0%,100%{
      filter:drop-shadow(0 0 20px rgba(255,63,142,0.7))
             drop-shadow(0 0 45px rgba(255,63,142,0.4));
    }
    50%{
      filter:drop-shadow(0 0 40px rgba(255,63,142,1))
             drop-shadow(0 0 85px rgba(255,63,142,0.7))
             drop-shadow(0 0 130px rgba(255,63,142,0.4));
    }
  }
  .hero-sub{
    font-family:'Rajdhani',sans-serif;font-weight:600;
    font-size:clamp(14px,1.6vw,20px);letter-spacing:4px;
    color:#f5e6ee;text-transform:uppercase;
    text-shadow:0 0 18px rgba(255,63,142,0.55);
  }
  .hero-tag{
    display:inline-flex;align-items:center;
    padding:12px 22px;border-radius:8px;
    background:rgba(255,255,255,0.02);
    border:1px solid rgba(255,63,142,0.18);
    font-family:'Courier New',monospace;
    font-size:clamp(12px,1.4vw,15px);
    color:#c0a8b8;letter-spacing:1px;
    min-height:42px;
  }
  .hero-tag .type-cursor{
    display:inline-block;width:8px;height:16px;margin-left:4px;
    background:#a888a0;vertical-align:middle;
    animation:pulse 1s ease-in-out infinite;
  }
  .hero-cta{
    display:inline-flex;align-items:center;gap:10px;
    padding:16px 40px;border-radius:9999px;
    background:linear-gradient(115deg,#b80060,#e60077 28%,#ff6fa8,#e60077 68%,#8a0049);
    background-size:260% 100%;
    color:#fff;font-weight:700;font-size:15px;
    border:none;cursor:pointer;
    box-shadow:0 0 30px rgba(255,63,142,0.6), inset 0 0 12px rgba(255,255,255,0.25);
    animation:crimsonFlow 3.5s ease-in-out infinite;
    transition:all 0.3s;
    text-decoration:none;
  }
  .hero-cta:hover{
    transform:translateY(-2px);
    box-shadow:0 0 45px rgba(255,63,142,0.9), inset 0 0 15px rgba(255,255,255,0.35);
  }
  .hero-cta svg{width:20px;height:20px}
  .hero-command{
    margin-top:14px;
    font-family:'Orbitron',sans-serif;font-weight:800;
    font-size:14px;letter-spacing:5px;
    color:#ff6fa8;text-transform:uppercase;
    text-shadow:0 0 22px rgba(255,63,142,0.7);
  }

  /* ==== SECTIONS ==== */
  .section{
    position:relative;padding:90px 24px;
    max-width:1200px;margin:0 auto;
  }
  .section-head{text-align:center;margin-bottom:60px}
  .section-badge{
    display:inline-flex;align-items:center;gap:8px;
    padding:6px 16px;border-radius:9999px;
    background:rgba(43,0,24,0.7);
    border:1px solid rgba(255,63,142,0.4);
    color:#ff9fc4;font-size:11.5px;
    font-weight:700;letter-spacing:3px;
    text-transform:uppercase;margin-bottom:14px;
    box-shadow:0 0 16px rgba(255,63,142,0.2);
  }
  .section-title{
    font-family:'Orbitron',sans-serif;
    font-weight:900;font-size:clamp(24px,4vw,42px);
    text-transform:uppercase;letter-spacing:2px;
    color:#f5e6ee;
    text-shadow:0 0 20px rgba(255,63,142,0.6);
  }

  /* ==== CREATORS ==== */
  .creators-wrap{
    position:relative;
    border-radius:28px;overflow:hidden;
    border:1px solid rgba(255,63,142,0.35);
    padding:40px;
    box-shadow:0 0 35px rgba(255,63,142,0.15), 0 12px 40px rgba(0,0,0,0.9);
    transition:border-color 0.3s;
  }
  .creators-wrap:hover{border-color:rgba(255,63,142,0.7)}
  .creators-bg{position:absolute;inset:0;z-index:0}
  .creators-bg img{width:100%;height:100%;object-fit:cover;filter:brightness(0.4) contrast(1.2);opacity:0.4}
  .creators-bg::after{
    content:'';position:absolute;inset:0;
    background:linear-gradient(180deg, rgba(8,5,8,0.9), rgba(14,7,10,0.85), rgba(8,5,8,0.95));
  }
  .creators-content{position:relative;z-index:1}
  .creators-head{text-align:center;margin-bottom:40px}
  .creators-badge{
    display:inline-flex;align-items:center;gap:8px;
    padding:5px 14px;border-radius:9999px;
    background:rgba(43,0,24,0.7);
    border:1px solid rgba(255,63,142,0.4);
    color:#ff9fc4;font-size:11px;font-weight:400;
    letter-spacing:3px;text-transform:uppercase;margin-bottom:12px;
    font-family:'Rajdhani',sans-serif;
  }
  .creators-badge strong{font-weight:900;color:#ff6fa8}
  .creators-title{
    font-family:'Orbitron',sans-serif;font-weight:900;
    font-size:clamp(20px,3vw,36px);text-transform:uppercase;
    letter-spacing:2px;color:#f5e6ee;
    text-shadow:0 0 22px rgba(255,63,142,0.6);
  }
  .creators-grid{display:grid;grid-template-columns:1fr;gap:32px;max-width:520px;margin:0 auto}

  .creator-card{display:flex;flex-direction:column;align-items:center;width:100%}
  .creator-role-head{display:flex;align-items:center;gap:8px;margin-bottom:14px}
  .creator-role-icon{
    padding:4px;border-radius:6px;
    background:rgba(92,0,48,0.6);border:1px solid rgba(255,63,142,0.4);
    color:#ff6fa8;display:flex;font-size:14px;
  }
  .creator-role-title{
    font-family:'Orbitron',sans-serif;font-weight:900;
    font-size:16px;letter-spacing:2px;
    text-transform:uppercase;color:#f5e6ee;
    text-shadow:0 0 10px rgba(255,63,142,0.5);
  }
  .creator-island{
    width:100%;border-radius:18px;padding:20px;
    background:radial-gradient(circle at top, rgba(35,12,16,0.65), rgba(12,10,16,0.95) 70%);
    border:1px solid rgba(255,63,142,0.4);
    box-shadow:0 0 20px rgba(255,63,142,0.12), 0 10px 28px rgba(0,0,0,0.7);
    transition:all 0.3s;position:relative;overflow:hidden;
  }
  .creator-island:hover{
    border-color:rgba(255,63,142,0.75);
    transform:translateY(-2px);
    box-shadow:0 0 30px rgba(255,63,142,0.28), 0 12px 32px rgba(0,0,0,0.85);
  }
  .creator-island::before{
    content:'';position:absolute;top:0;left:0;right:0;height:1.5px;
    background:linear-gradient(90deg,transparent,rgba(255,63,142,0.8),transparent);
  }
  .creator-row{display:flex;gap:16px;align-items:flex-start}
  .creator-avatar{
    position:relative;flex-shrink:0;
    width:56px;height:56px;border-radius:18px;
    border:1px solid rgba(255,63,142,0.4);
    background:#1a1220;overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 15px rgba(255,63,142,0.15);
  }

  function drawFlower(f) {
    ctx.save();
    ctx.translate(f.x, f.y);
    ctx.rotate(f.rotation * Math.PI / 180);
    ctx.scale(1, Math.sin(f.flip));
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.bezierCurveTo(f.size / 2, -f.size / 2, f.size, -f.size / 4, f.size, f.size / 2);
    ctx.bezierCurveTo(f.size, f.size, f.size / 2, f.size * 1.2, 0, f.size);
    ctx.bezierCurveTo(-f.size / 2, f.size * 1.2, -f.size, f.size, -f.size, f.size / 2);
    ctx.bezierCurveTo(-f.size, -f.size / 4, -f.size / 2, -f.size / 2, 0, 0);
    ctx.closePath();
    ctx.fillStyle = f.color;
    ctx.globalAlpha = f.opacity;
    if (!isMobile) {
      ctx.shadowColor = 'rgba(255, 63, 142, 0.4)';
      ctx.shadowBlur = 3;
    }
    ctx.fill();
    ctx.restore();
  }

  function loop() {
    ctx.clearRect(0, 0, w, h);
    for (let i = 0; i < flowers.length; i++) {
      const f = flowers[i];
      f.x += f.speedX + Math.sin(f.y * 0.004) * 0.35;
      f.y += f.speedY;
      f.rotation += f.rotationSpeed;
      f.flip += f.flipSpeed;
      if (f.y > h + 15) { f.y = -15; f.x = Math.random() * w; }
      if (f.x > w + 15) f.x = -15;
      else if (f.x < -15) f.x = w + 15;
      drawFlower(f);
    }
    requestAnimationFrame(loop);
  }
  loop();

  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) loop();
  });
